spring.application.name=workplan-backend
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

app.version=0.1.0

spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:54329}/${DATABASE_NAME:winh_workplan}?sslmode=disable
spring.datasource.username=${DATABASE_USERNAME:winh}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.pool-name=workplan-db-pool
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-login=${APP_BOOTSTRAP_ADMIN_LOGIN:admin}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:本地管理员}
app.bootstrap.organization-name=${APP_BOOTSTRAP_ORGANIZATION_NAME:本地示例组织}
app.session.cookie-name=WINH_SESSION
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:false}
app.session.absolute-hours=8
app.session.idle-minutes=30
app.session.failed-login-limit=5
app.session.lock-minutes=15

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.files.endpoint=${FILE_S3_ENDPOINT:}
app.files.region=${FILE_S3_REGION:us-east-1}
app.files.bucket=${FILE_S3_BUCKET:winh-project-files}
app.files.access-key=${FILE_S3_ACCESS_KEY:}
app.files.secret-key=${FILE_S3_SECRET_KEY:}
app.files.max-bytes=${FILE_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${FILE_MAX_BYTES:20971520}
spring.servlet.multipart.max-request-size=22MB
