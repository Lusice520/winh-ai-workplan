<!doctype html>

    <style>
      :root {
        color: #172235;
        background: #edf1f7;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 3058px;
        margin: 0;
        padding: 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      h2 {
        margin: 30px 0 12px;
        font-size: 16px;
      }

      .pair {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid #cdd7e5;
        background: #fff;
        box-shadow: 0 8px 24px rgb(35 52 81 / 10%);
      }

      figcaption {
        border-bottom: 1px solid #e1e7ef;
        background: #fff;
        color: #52627a;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 12px;
      }

      .full figure,
      .full img {
        width: 1487px;
      }

      img {
        display: block;
      }

      .crop {
        position: relative;
        overflow: hidden;
        background: #fff;
      }

      .crop img {
        position: absolute;
        max-width: none;
      }

      .table figure,
      .table .crop {
        width: 590px;
      }

      .table .crop {
        height: 890px;
      }

      .table img {
        width: 1487px;
        transform: translate(-526px, -130px);
      }

      .inspector figure,
      .inspector .crop {
        width: 338px;
      }

      .inspector .crop {
        height: 890px;
      }

      .inspector img {
        width: 1487px;
        transform: translate(-1124px, -130px);
      }
    </style>
